[package]
name = "wares-render"
version = "1.0.0"
edition = "2021"
authors = ["VisdomXD"]
description = "Wares Launcher software 3D player renderer (no_std, compiled to WebAssembly)"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
